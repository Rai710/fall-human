# ByteTrack settings based on Ultralytics defaults (AGPL-3.0).
# https://github.com/ultralytics/ultralytics/blob/main/ultralytics/cfg/trackers/bytetrack.yaml
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
# Start IDs conservatively; existing IDs can still recover low-score boxes.
new_track_thresh: 0.6
track_buffer: 30
match_thresh: 0.8
fuse_score: true
